# ========================================
# SOPS Configuration
# Birthday Message Scheduler
# ========================================
#
# This file configures SOPS (Secrets OPerationS) encryption
# for environment-specific secret files.
#
# Documentation: https://github.com/getsops/sops
# ========================================

creation_rules:
  # The second recipient is the CI-only key held in the SOPS_AGE_KEY Actions secret.
  - path_regex: \.env(\.(development|test|production))?(\.enc)?$
    age: >-
      age19txs0a7xl89m2f0983fn0k3szj78n3tcjv8gddkvzk72r3fwsa3ssw0clq,
      age10kxw94vp0kwe0ps678fs5wqlm3x3gtj7pn05lj4peu35vn3cqaxsvt40vk

# ========================================
# Encryption Strategy
# ========================================
#
# A `.env.*.enc` file is a sops binary file: the whole dotenv text is encrypted as one value.
# An `encrypted_regex` cannot apply here, because the only key of a binary file is `data`;
# the old per-key regex matched nothing and left every value in plaintext.
#
# ========================================
